services:
  devree-platform:
    build: .
    ports:
      - "3100:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - MAUTIC_URL=${MAUTIC_URL}
      - MATOMO_API_TOKEN=${MATOMO_API_TOKEN}
      - NEWSLETTER_SIGNUP_ENABLED=${NEWSLETTER_SIGNUP_ENABLED:-false}
      - NEWSLETTER_CONFIRM_EMAIL_ID=${NEWSLETTER_CONFIRM_EMAIL_ID}
      - NEWSLETTER_PUBLIC_ORIGIN=${NEWSLETTER_PUBLIC_ORIGIN:-https://kantoor.devreemakelaardij.nl}
      - MAUTIC_CLIENT_ID=${MAUTIC_CLIENT_ID}
      - MAUTIC_CLIENT_SECRET=${MAUTIC_CLIENT_SECRET}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - NEXT_PUBLIC_MAUTIC_URL=${MAUTIC_URL}
      - NEXT_PUBLIC_DEBITEUREN_URL=${DEBITEUREN_URL}
      - DOCUMENSO_URL=${DOCUMENSO_URL}
      - DOCUMENSO_API_URL=${DOCUMENSO_API_URL}
      - DOCUMENSO_API_TOKEN=${DOCUMENSO_API_TOKEN}
      - DOCUMENSO_ATTACHMENT_PUBLIC_BASE_URL=${DOCUMENSO_ATTACHMENT_PUBLIC_BASE_URL}
      - DOCUMENSO_REDIRECT_URL=${DOCUMENSO_REDIRECT_URL}
      - PROPOSAL_PUBLIC_BASE_URL=${PROPOSAL_PUBLIC_BASE_URL}
      - APPOINTMENT_PUBLIC_BASE_URL=${APPOINTMENT_PUBLIC_BASE_URL}
      - APPOINTMENT_VIDEO_UPLOAD_DIR=${APPOINTMENT_VIDEO_UPLOAD_DIR}
      - PLATFORM_INTERNAL_URL=${PLATFORM_INTERNAL_URL}
      - PBX_SERVICE_SECRET=${PBX_SERVICE_SECRET}
      - PBX_SEND_MODE=${PBX_SEND_MODE:-off}
      - PBX_TEST_NUMBERS=${PBX_TEST_NUMBERS}
      - PBX_RECORDING_DIR=/app/uploads/pbx
      - PBX_BRIDGE_HEALTH_URL=${PBX_BRIDGE_HEALTH_URL}
      - DOCUMENSO_OTD_ATTACHMENT_ITEM_IDS=${DOCUMENSO_OTD_ATTACHMENT_ITEM_IDS}
      - DOCUMENSO_OTD_ATTACHMENT_URLS=${DOCUMENSO_OTD_ATTACHMENT_URLS}
      - DOCUMENSO_OTD_AANKOOP_ATTACHMENT_ITEM_IDS=${DOCUMENSO_OTD_AANKOOP_ATTACHMENT_ITEM_IDS}
    volumes:
      - ./uploads/pbx:/app/uploads/pbx
      - ./uploads/appointment-videos:/app/uploads/appointment-videos
    restart: unless-stopped
    networks:
      - devree-network

networks:
  devree-network:
    driver: bridge
