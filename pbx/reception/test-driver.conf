; Temporary acceptance-test contexts. These dial only Local channels, never PSTN.
; Load explicitly during testing and remove afterwards.
[devree-reception-check-entry]
exten => s,1,Set(CALLERID(num)=+99900000000)
 same => n,Goto(devree-reception-menu,s,1)
[devree-reception-check]
exten => callback,1,Wait(2)
 same => n,SendDTMF(1)
 same => n,Wait(2)
 same => n,SendDTMF(2)
 same => n,Playtones(440)
 same => n,Wait(30)
 same => n,StopPlaytones()
 same => n,Hangup()
exten => viewing,1,Wait(2)
 same => n,SendDTMF(2)
 same => n,Wait(25)
 same => n,SendDTMF(2)
 same => n,Wait(5)
 same => n,Hangup()
exten => missed,1,Wait(3)
 same => n,Hangup()
