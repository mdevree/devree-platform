# Productie configuratie voor Portainer
# Gebruikt image van GHCR in plaats van lokale build
services:
  devree-platform:
    image: ghcr.io/mdevree/devree-platform:latest
    container_name: devree-platform
    environment:
      - TZ=${TZ:-Europe/Amsterdam}
      - DATABASE_URL=${DATABASE_URL}
      - DEBITEUREN_API_URL=${DEBITEUREN_API_URL}
      - DEBITEUREN_READ_API_TOKEN=${DEBITEUREN_READ_API_TOKEN}
      - DEBITEUREN_WRITE_API_TOKEN=${DEBITEUREN_WRITE_API_TOKEN}
      - DEBITEUREN_SSO_SECRET=${DEBITEUREN_SSO_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=true
      - MAUTIC_URL=${MAUTIC_URL}
      - MATOMO_API_TOKEN=${MATOMO_API_TOKEN}
      - NEWSLETTER_SIGNUP_ENABLED=${NEWSLETTER_SIGNUP_ENABLED:-false}
      - NEWSLETTER_CONFIRM_EMAIL_ID=${NEWSLETTER_CONFIRM_EMAIL_ID}
      - NEWSLETTER_PUBLIC_ORIGIN=${NEWSLETTER_PUBLIC_ORIGIN:-https://kantoor.devreemakelaardij.nl}
      - MAUTIC_CLIENT_ID=${MAUTIC_CLIENT_ID}
      - MAUTIC_CLIENT_SECRET=${MAUTIC_CLIENT_SECRET}
      - N8N_URL=${N8N_URL}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - WAHA_API_URL=${WAHA_API_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION}
      - WHATSAPP_REPLY_OFFICE_ENABLED=${WHATSAPP_REPLY_OFFICE_ENABLED:-0}
      - WHATSAPP_REPLY_PERSONAL_ENABLED=${WHATSAPP_REPLY_PERSONAL_ENABLED:-0}
      - WHATSAPP_REPLY_OWNER_USER_ID=${WHATSAPP_REPLY_OWNER_USER_ID:-}
      - WHATSAPP_REPLY_PERSONAL_EXCLUSION_TAG=${WHATSAPP_REPLY_PERSONAL_EXCLUSION_TAG:-whatsapp-persoonlijk-uitsluiten}
      - WHATSAPP_REPLY_OPENAI_API_KEY=${WHATSAPP_REPLY_OPENAI_API_KEY:-}
      - WHATSAPP_REPLY_N8N_GATEWAY=${WHATSAPP_REPLY_N8N_GATEWAY:-0}
      - WHATSAPP_REPLY_OPENAI_MODEL=${WHATSAPP_REPLY_OPENAI_MODEL:-gpt-6.1-terra}
      - WAHA_PERSONAL_API_URL=${WAHA_PERSONAL_API_URL:-}
      - WAHA_PERSONAL_API_KEY=${WAHA_PERSONAL_API_KEY:-}
      - WAHA_PERSONAL_SESSION=${WAHA_PERSONAL_SESSION:-}
      - WAHA_PERSONAL_WEBHOOK_HMAC_KEY=${WAHA_PERSONAL_WEBHOOK_HMAC_KEY:-}
      - WHATSAPP_DRAFT_PUSH_WORKER=${WHATSAPP_DRAFT_PUSH_WORKER:-0}
      - WHATSAPP_WEB_PUSH_VAPID_SUBJECT=${WHATSAPP_WEB_PUSH_VAPID_SUBJECT:-https://kantoor.devreemakelaardij.nl}
      - WHATSAPP_WEB_PUSH_VAPID_PUBLIC_KEY=${WHATSAPP_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WHATSAPP_WEB_PUSH_VAPID_PRIVATE_KEY=${WHATSAPP_WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WHATSAPP_APNS_TEAM_ID=${WHATSAPP_APNS_TEAM_ID:-}
      - WHATSAPP_APNS_KEY_ID=${WHATSAPP_APNS_KEY_ID:-}
      - WHATSAPP_APNS_KEY_BASE64=${WHATSAPP_APNS_KEY_BASE64:-}
      - WHATSAPP_APNS_TOPIC=${WHATSAPP_APNS_TOPIC:-}
      - N8N_WEBHOOK_WHATSAPP_SUMMARY_URL=${N8N_WEBHOOK_WHATSAPP_SUMMARY_URL}
      - NEXT_PUBLIC_MAUTIC_URL=${NEXT_PUBLIC_MAUTIC_URL}
      - NEXT_PUBLIC_DEBITEUREN_URL=${NEXT_PUBLIC_DEBITEUREN_URL}
      - NEXT_PUBLIC_PLATFORM_URL=${NEXT_PUBLIC_PLATFORM_URL}
      - WP_API_USER=${WP_API_USER}
      - WP_API_PASSWORD=${WP_API_PASSWORD}
      - FRIDU_RADAR_API_URL=${FRIDU_RADAR_API_URL}
      - FRIDU_RADAR_API_KEY=${FRIDU_RADAR_API_KEY}
      - FRIDU_RADAR_TIMEOUT_MS=${FRIDU_RADAR_TIMEOUT_MS}
      - WHATSAPP_WEBHOOK_DEBUG=${WHATSAPP_WEBHOOK_DEBUG}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL}
      - APPOINTMENT_WHATSAPP_NUMBER=${APPOINTMENT_WHATSAPP_NUMBER:-31181611919}
      - APPOINTMENT_PUBLIC_BASE_URL=${APPOINTMENT_PUBLIC_BASE_URL}
      - APPOINTMENT_VIDEO_UPLOAD_DIR=${APPOINTMENT_VIDEO_UPLOAD_DIR}
      - PBX_SERVICE_SECRET=${PBX_SERVICE_SECRET}
      - PBX_SEND_MODE=${PBX_SEND_MODE:-off}
      - PBX_TEST_NUMBERS=${PBX_TEST_NUMBERS}
      - PBX_RECORDING_DIR=/app/uploads/pbx
      - PBX_BRIDGE_HEALTH_URL=${PBX_BRIDGE_HEALTH_URL}
      - CHEATSHEET_WEBHOOK_URL=${CHEATSHEET_WEBHOOK_URL}
      - MAUTIC_WEBHOOK_SECRET=${MAUTIC_WEBHOOK_SECRET}
      - GOTENBERG_URL=${GOTENBERG_URL}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER}
      - NEXTCLOUD_APP_PASSWORD=${NEXTCLOUD_APP_PASSWORD}
      - NEXTCLOUD_BASE_PATH=${NEXTCLOUD_BASE_PATH}
      - PORT=3100
    volumes:
      - ./uploads/pbx:/app/uploads/pbx
      - ./uploads/appointment-videos:/app/uploads/appointment-videos
    restart: unless-stopped
    network_mode: host
